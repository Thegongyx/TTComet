<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>乒乓彗星 TTComet · 自动高光</title>
<link rel="icon" href="/static/favicon.ico" />
<style>
  :root {
    /* 渐变背景 + 蓝紫主色 + 青色霓虹（参考：深海军蓝登录页风格） */
    color-scheme:dark;                 /* 原生控件（下拉列表/滚动条）跟随深色 */
    --bg:#141e30;
    --panel:rgba(255,255,255,.055);
    --panel2:rgba(255,255,255,.09);
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.20);
    --text:#eef3ff;
    --muted:#93a4c0;
    --accent:#7287fe;
    --accent-2:#8258ba;
    --cyan:#45f3ff;
    --ok:#3ddc97;
    --bad:#ff5a76;
    --warn:#ffc857;
    --up:#6fd7ff;
    --dn:#ffb066;
  }
  * { box-sizing:border-box; }
  html, body { min-height:100%; }
  body {
    margin:0; color:var(--text);
    font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#141e30 0%,#1a2942 48%,#243b55 100%);
    background-attachment:fixed;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(680px 420px at 8% -8%, rgba(114,135,254,.22), transparent 62%),
      radial-gradient(620px 380px at 96% 2%, rgba(69,243,255,.10), transparent 60%),
      radial-gradient(720px 440px at 50% 110%, rgba(130,88,186,.18), transparent 62%);
  }
  .wrap { position:relative; z-index:1; max-width:1180px; margin:0 auto;
          padding:26px 20px 70px; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.16); border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.26); }
  ::-webkit-scrollbar-track { background:transparent; }

  .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  h1 { font-size:20px; margin:0 0 6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  h1 small { color:var(--muted); font-weight:400; font-size:12px; }
  .brand-en { color:var(--cyan); font-size:13px; font-weight:600; letter-spacing:.4px; }
  .brand-en:empty { display:none; }
  .topbar-right { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .lang-switch { display:flex; gap:6px; }
  .quit-btn { border-color:rgba(255,90,118,.35); color:#ffb3bf; }
  .quit-btn:hover:not(:disabled) { border-color:rgba(255,90,118,.7);
                                   background:rgba(255,90,118,.12) !important; }
  .lang-switch button { padding:5px 12px; font-size:12px; font-weight:500; }
  .lang-switch button.active { border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 0 1px rgba(69,243,255,.25) inset; }

  .health { font-size:12px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
  .health b { color:var(--text); font-weight:600; }
  .panel {
    background:linear-gradient(180deg, rgba(26,39,62,.72), rgba(17,28,46,.78));
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-top:16px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 12px 34px rgba(6,12,24,.38), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .panel h2 { font-size:14px; margin:0 0 12px; color:#dfe8fb; font-weight:600;
              letter-spacing:.2px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:5px; min-width:0; }
  label { color:var(--muted); font-size:12px; }
  input[type=number], input[type=text] {
    background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:7px 9px; font-size:13px; width:100%;
  }
  select {
    background-color:#16233a;
    border:1px solid var(--line); border-radius:10px;
    color:#eef3ff; padding:7px 30px 7px 9px; font-size:13px; width:100%;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%2393a4c0' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 11px center;
  }
  select option { background-color:#16233a; color:#eef3ff; }
  input:focus, select:focus {
    outline:none; border-color:rgba(69,243,255,.55);
    box-shadow:0 0 0 3px rgba(69,243,255,.13);
  }
  button {
    background:linear-gradient(135deg,#7287fe,#8258ba);
    color:#fff; border:0; border-radius:11px;
    padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer;
    box-shadow:0 8px 22px rgba(114,135,254,.30);
    transition:transform .12s ease, filter .18s ease, box-shadow .2s ease;
  }
  button:hover:not(:disabled) {
    filter:brightness(1.09);
    box-shadow:0 10px 28px rgba(114,135,254,.44);
  }
  button:active:not(:disabled) { transform:translateY(1px) scale(.995); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:rgba(255,255,255,.05); border:1px solid var(--line);
                 color:var(--text); font-weight:400; box-shadow:none; }
  button.ghost:hover:not(:disabled) { background:rgba(255,255,255,.10);
                 border-color:rgba(69,243,255,.45); box-shadow:none; }
  button.sm { padding:4px 10px; font-size:12px; }
  .pathbox { display:flex; gap:10px; align-items:center; }
  .pathbox input { flex:1; font-family:Consolas,monospace; font-size:12px; }
  .picked { margin-top:10px; font-size:13px; color:var(--muted); }
  .picked b { color:var(--text); }

  /* ---------- Hero: three.js 动画区 ---------- */
  .hero {
    position:relative; height:252px; margin-top:14px; border-radius:12px;
    overflow:hidden; border:1px solid var(--line);
    background:linear-gradient(160deg,#1d2c46 0%,#16233a 55%,#101a2b 100%);
    animation: fadeUp .5s ease both;
  }
  .hero::after {
    content:""; position:absolute; inset:auto 0 0 0; height:64px; pointer-events:none;
    background:linear-gradient(to top, rgba(16,26,43,.88), transparent);
  }
  .hero canvas { display:block; width:100%; height:100%; }
  .hero .hero-bar {
    position:absolute; left:16px; right:16px; bottom:12px; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .hero .hero-cap { font-size:12px; color:var(--muted); }
  .hero .hero-cap b { color:var(--text); }
  .hero .hero-teams { margin-bottom:3px; }
  .hero-chips { display:flex; gap:14px; font-size:11px; color:var(--muted); }
  .hero-chips i {
    display:inline-block; width:6px; height:6px; border-radius:50%;
    margin-right:5px; vertical-align:middle;
  }
  .hero-chips .c1 { background:#3ec8ff; box-shadow:0 0 7px #3ec8ff; animation:pulse 2.4s ease-in-out infinite; }
  .hero-chips .c2 { background:#7fe3ff; box-shadow:0 0 7px #7fe3ff; animation:pulse 2.4s ease-in-out .5s infinite; }
  .hero-chips .c3 { background:#ffd166; box-shadow:0 0 7px #ffd166; animation:pulse 2.4s ease-in-out 1s infinite; }
  .scene-fallback { display:none; }

  /* ---------- 动效 ---------- */
  @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @keyframes flow   { to { background-position:-200% 0; } }
  @keyframes pulse  { 50% { opacity:.55; } }

  .panel { transition:border-color .25s ease, box-shadow .25s ease; }
  .panel:hover { border-color:var(--line-strong);
                 box-shadow:0 16px 40px rgba(6,12,24,.46), inset 0 1px 0 rgba(255,255,255,.09); }
  .panel { animation:fadeUp .45s ease both; }
  .panel:nth-of-type(2) { animation-delay:.04s; }
  .panel:nth-of-type(3) { animation-delay:.08s; }

  .bar { height:9px; background:rgba(255,255,255,.08); border-radius:999px;
         overflow:hidden; margin:12px 0 8px;
         box-shadow:inset 0 1px 2px rgba(0,0,0,.35); }
  .bar > i {
    display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#45f3ff,#7287fe,#8258ba);
    background-size:200% 100%;
    box-shadow:0 0 14px rgba(69,243,255,.55);
    border-radius:999px;
    transition:width .25s;
  }
  .bar.active > i { animation:flow 1.3s linear infinite; }

  details[open] > .gdesc, details[open] > .grid { animation:fadeUp .22s ease both; }
  .st.running { animation:pulse 1.2s ease-in-out infinite; }
  .vitem { animation:fadeUp .25s ease both; }
  .logline { animation:fadeUp .16s ease both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.001ms !important; animation-iteration-count:1 !important;
        transition-duration:.001ms !important; }
  }

  /* ---------- 参数区 ---------- */
  details { border-top:1px solid var(--line); padding:6px 0 2px; }
  details:first-of-type { border-top:0; }
  summary { cursor:pointer; font-size:13px; font-weight:600; list-style:none;
            display:flex; gap:8px; align-items:baseline; padding:8px 6px;
            border-radius:8px; user-select:none; color:#dbe5f7; }
  summary:hover { background:rgba(255,255,255,.055); }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸"; color:var(--muted); transition:transform .15s;
                    display:inline-block; width:12px; flex:none; }
  details[open] summary::before { transform:rotate(90deg); }
  summary .cnt { color:var(--muted); font-weight:400; font-size:11px; }
  summary .tagmod { color:var(--accent); font-weight:400; font-size:11px; }
  .gdesc { color:var(--muted); font-size:11.5px; padding:0 0 6px 26px; line-height:1.5; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(262px,1fr));
          gap:16px 20px; padding:10px 0 14px 26px; align-items:start; }
  .pitem { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .pitem > label { color:var(--muted); font-size:12px; }

  .pitem.chk { display:grid; grid-template-columns:auto minmax(0,1fr);
               column-gap:9px; row-gap:4px; align-items:start; }
  .pitem.chk > label { color:var(--text); font-size:13px; line-height:1.45;
                       cursor:pointer; }
  .pitem.chk input[type=checkbox] { width:auto; margin:3px 0 0; accent-color:var(--accent); }
  .pitem.chk .tips { grid-column:2; }
  .pitem.wide { grid-column:1 / -1; }

  .tips { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .tips span { font-size:11px; line-height:1.5; color:var(--muted); }
  .tips .up::before { content:"↑ "; color:var(--up); font-weight:700; }
  .tips .dn::before { content:"↓ "; color:var(--dn); font-weight:700; }
  .tips .note { color:#8090ab; }

  .disabled-group { opacity:.42; }
  .disabled-group summary { cursor:not-allowed; }
  .hint { color:var(--muted); font-size:11px; }

  /* ---------- 参数预设 ---------- */
  .preset-bar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 12px; margin-bottom:14px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line); border-radius:12px;
  }
  .preset-bar > label { font-size:12px; color:var(--muted); }
  .preset-bar select { width:auto; min-width:170px; max-width:260px; padding:6px 10px; }
  .preset-bar .hint { margin-left:auto; }

  .dlg { width:min(430px,92vw); }
  .dlg-head { padding:15px 18px; border-bottom:1px solid var(--line);
              font-size:14px; font-weight:600; }
  .dlg-body { padding:16px 18px; }
  .dlg-body input { width:100%; }
  .dlg-msg { color:var(--text); font-size:13px; line-height:1.6; }
  .dlg-err { color:var(--bad); font-size:11px; min-height:16px; margin-top:6px; }
  .dlg-hint { color:var(--muted); font-size:11px; margin-top:2px; }
  .dlg-foot { padding:12px 18px; border-top:1px solid var(--line);
              display:flex; justify-content:flex-end; gap:8px; }
  button.danger { background:linear-gradient(135deg,#ff6b81,#d63a5a);
                  box-shadow:0 8px 22px rgba(255,90,118,.28); }

  /* ---------- 任务区 ---------- */
  .meta { display:flex; gap:16px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .vlist { margin-top:12px; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .vitem { display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:13px;
           border-top:1px solid var(--line); }
  .vitem:first-child { border-top:0; }
  .vitem.running { background:rgba(114,135,254,.13); }
  .vitem .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vitem .st { font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--line); }
  .st.pending { color:var(--muted); }
  .st.running { color:var(--accent); border-color:var(--accent); }
  .st.done { color:var(--ok); border-color:var(--ok); }
  .st.failed { color:var(--bad); border-color:var(--bad); }
  .st.cancelled { color:var(--warn); border-color:var(--warn); }
  pre.log { background:rgba(8,14,26,.62); border:1px solid var(--line); border-radius:12px;
            padding:12px; height:230px; overflow:auto; font-size:12px; line-height:1.5;
            color:#a9b8d1; white-space:pre-wrap; margin:12px 0 0;
            font-family:Consolas,"Cascadia Mono",monospace; }
  video { width:100%; border-radius:8px; margin-top:10px; background:#000; }
  .hidden { display:none !important; }

  /* ---------- 文件浏览器 ---------- */
  .mask { position:fixed; inset:0; background:rgba(8,14,26,.66); backdrop-filter:blur(3px);
          display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           width:min(860px,92vw); max-height:80vh; display:flex; flex-direction:column; }
  .modal .head { padding:14px 16px; border-bottom:1px solid var(--line);
                 display:flex; gap:10px; align-items:center; }
  .modal .head input { flex:1; font-family:Consolas,monospace; font-size:12px; }
  .modal .body { overflow:auto; padding:8px 0; flex:1; }
  .modal .foot { padding:10px 16px; border-top:1px solid var(--line);
                 display:flex; justify-content:space-between; gap:10px; }
  .fsrow { display:flex; align-items:center; gap:10px; padding:7px 16px; cursor:pointer;
           font-size:13px; }
  .fsrow:hover { background:rgba(255,255,255,.07); }
  .fsrow .ic { width:18px; text-align:center; }
  .fsrow .sz { color:var(--muted); font-size:11px; margin-left:auto; }
  .fsquick { display:flex; gap:8px; flex-wrap:wrap; padding:10px 16px;
             border-bottom:1px solid var(--line); }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>
      <span>🏓</span>
      <span data-i18n="app.name">乒乓彗星</span>
      <span class="brand-en" data-i18n="app.brand">TTComet</span>
      <small data-i18n="app.subtitle">自动高光剪辑 · 本地运行</small>
    </h1>
    <div class="topbar-right">
      <div class="lang-switch">
        <button class="ghost sm" data-lang="zh">中文</button>
        <button class="ghost sm" data-lang="en">EN</button>
      </div>
      <button class="ghost sm quit-btn" id="btnQuit" data-i18n="quit.button">退出程序</button>
    </div>
  </div>
  <div class="health" id="health">…</div>

  <!-- ============ three.js 动画区 ============ -->
  <div class="hero" id="hero">
    <canvas id="ppScene"></canvas>
    <div class="hero-bar">
      <div class="hero-cap">
        <div class="hero-teams"><b id="heroPair">…</b></div>
        <div class="hero-chips">
          <span><i class="c1"></i><span data-i18n="hero.trail">速度残影</span></span>
          <span><i class="c2"></i><span data-i18n="hero.bounce">落点标记</span></span>
          <span><i class="c3"></i><span data-i18n="hero.speed">球速显示</span></span>
        </div>
      </div>
      <button class="ghost sm" id="btnShuffle" data-i18n="hero.shuffle">换一组对手</button>
    </div>
  </div>

  <!-- ============ 输入 ============ -->
  <div class="panel">
    <h2 data-i18n="panel.input">① 选择视频</h2>
    <div class="pathbox">
      <input type="text" id="selPath" data-i18n-ph="input.placeholder" placeholder="未选择（可手动粘贴路径）" spellcheck="false" />
      <button class="ghost" id="btnFile" data-i18n="input.pickFile">选择视频文件</button>
      <button class="ghost" id="btnDir" data-i18n="input.pickDir">选择文件夹</button>
    </div>
    <div class="pathbox" style="margin-top:10px">
      <input type="text" id="outDir" data-i18n-ph="input.outDirPh" placeholder="输出目录（留空 = 默认目录）" spellcheck="false" />
      <button class="ghost" id="btnOutDir" data-i18n="input.pickOutDir">选择输出目录</button>
    </div>
    <div class="picked" id="picked" data-i18n="input.hint">支持 mp4 / mov / mkv / avi / webm 等；选文件夹时会扫描该目录下所有视频批量处理</div>
  </div>

  <!-- ============ 参数 ============ -->
  <div class="panel">
    <h2 data-i18n="panel.params">② 参数（按业务分组，默认全部折叠，保持默认即可）</h2>
    <div class="preset-bar">
      <label data-i18n="preset.label">预设</label>
      <select id="presetSel"><option value="" data-i18n="preset.none">— 未选择 —</option></select>
      <button class="ghost sm" id="btnApplyPreset" data-i18n="preset.apply" disabled>应用</button>
      <button class="ghost sm" id="btnSavePreset" data-i18n="preset.save">保存当前参数</button>
      <button class="ghost sm" id="btnRenamePreset" data-i18n="preset.rename" disabled>重命名</button>
      <button class="ghost sm" id="btnDeletePreset" data-i18n="preset.delete" disabled>删除</button>
      <span class="hint" id="presetHint"></span>
    </div>
    <div id="params"></div>
    <div class="row" style="margin-top:10px">
      <button id="btnReset" class="ghost sm" data-i18n="params.reset">恢复默认</button>
      <span class="hint" id="changeHint"></span>
    </div>
  </div>

  <!-- ============ 任务 ============ -->
  <div class="panel">
    <h2 data-i18n="panel.run">③ 处理</h2>
    <div class="row">
      <button id="btnRun" style="min-width:160px" data-i18n="run.start">开始处理</button>
      <button id="btnCancel" class="ghost" data-i18n="run.cancel" disabled>取消</button>
      <span class="meta" id="runMeta"></span>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="meta">
      <span id="mStage" data-i18n="run.waiting">等待开始</span>
      <span id="mVideo"></span>
      <span id="mFrames"></span>
      <span id="mFps"></span>
      <span id="mEta"></span>
    </div>
    <div class="vlist hidden" id="vlist"></div>
    <video id="player" controls playsinline class="hidden"></video>
    <div class="meta hidden" id="dlWrap" style="margin-top:8px">
      <a id="dlLink" download data-i18n="result.download">下载当前视频</a>
      <span id="dlMeta"></span>
    </div>
    <pre class="log" id="log"></pre>
  </div>
</div>

<script src="/static/i18n.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const T = (k, vars) => window.t(k, vars);

/* =========================================================================
 * 参数定义（文案全部走 i18n 的 p.<key>.label / .up / .dn / .note）
 * ========================================================================= */
const PARAM_GROUPS = [
  { key: "model", items: [
      { key: "model", type: "select", def: "m960", options: ["m960", "s960"], optKey: "model." },
  ]},
  { key: "output", items: [
      { key: "cut", type: "checkbox", def: true, wide: true },
      { key: "output_height", type: "number", def: "", min: 240, max: 4320, step: 2 },
      { key: "encoder", type: "select", def: "auto",
        options: ["auto", "libx264", "h264_amf", "hevc_amf"], optKey: "opt.encoder." },
      { key: "no_audio", type: "checkbox", def: false },
  ]},
  { key: "detect", items: [
      { key: "conf_ball", type: "number", def: 0.10, min: 0.01, max: 1, step: 0.01 },
      { key: "conf_table", type: "number", def: "", min: 0.01, max: 1, step: 0.01 },
      { key: "conf_net", type: "number", def: "", min: 0.01, max: 1, step: 0.01 },
      { key: "conf_player", type: "number", def: "", min: 0.01, max: 1, step: 0.01 },
      { key: "iou", type: "number", def: 0.45, min: 0.1, max: 0.95, step: 0.05 },
  ]},
  { key: "track", items: [
      { key: "ball_conf", type: "number", def: 0.50, min: 0.05, max: 1, step: 0.01 },
      { key: "min_static_ball_count", type: "number", def: 20, min: 0, step: 1 },
      { key: "max_jump_ratio", type: "number", def: 0.10, min: 0.01, max: 1, step: 0.01 },

        options: ["auto", "hungarian", "greedy"], optKey: "opt.algo." },

  ]},

const paramInputs = {};   // key -> { el, def, type, onlyWhenCut, disabledWhenPrependOff }
const groupRefs = [];     // { el, refs, onlyWhenCut }

/** 仅当当前语言字典里存在该 key 时才返回文案（用于可选的上/下调说明） */
function tipText(key, suffix) {
  const dict = window.I18N.dict[window.I18N.lang] || {};
  const k = `p.${key}.${suffix}`;
  return dict[k] !== undefined ? T(k) : null;
}

function buildParams() {
  const root = $('params');
  root.innerHTML = '';
  for (const g of PARAM_GROUPS) {
    const d = document.createElement('details');
    const s = document.createElement('summary');
    const title = T(`g.${g.key}.title`);
    const desc = T(`g.${g.key}.desc`);
    s.innerHTML = `<span>${title}</span>
      <span class="cnt">${T('params.count', { n: g.items.length })}</span>
      <span class="tagmod hidden" data-role="mod"></span>`;
    d.appendChild(s);
    const ds = document.createElement('div');
    ds.className = 'gdesc';
    ds.textContent = desc;
    d.appendChild(ds);

    const grid = document.createElement('div');
    grid.className = 'grid';
    const refs = [];
    for (const it of g.items) {
      const wrap = document.createElement('div');
      let el, labelEl;
      const labelText = T(`p.${it.key}.label`);

      if (it.type === 'checkbox') {
        wrap.className = 'pitem chk' + (it.wide ? ' wide' : '');
        el = document.createElement('input');
        el.type = 'checkbox';
        el.checked = !!it.def;
        labelEl = document.createElement('label');
        labelEl.textContent = labelText;
        labelEl.onclick = () => { el.checked = !el.checked;
          el.dispatchEvent(new Event('change', { bubbles: true })); };
        wrap.appendChild(el);
        wrap.appendChild(labelEl);
      } else if (it.type === 'select') {
        wrap.className = 'pitem' + (it.wide ? ' wide' : '');
        labelEl = document.createElement('label');
        labelEl.textContent = labelText;
        el = document.createElement('select');
        for (const v of it.options) {
          const o = document.createElement('option');
          o.value = v;
          o.textContent = T((it.optKey || '') + v);
          if (v === it.def) o.selected = true;
          el.appendChild(o);
        }
        wrap.appendChild(labelEl); wrap.appendChild(el);
      } else {
        wrap.className = 'pitem' + (it.wide ? ' wide' : '');
        labelEl = document.createElement('label');
        labelEl.textContent = labelText;
        el = document.createElement('input');
        el.type = 'number';
        if (it.def !== '') el.value = it.def;
        if (it.min !== undefined) el.min = it.min;
        if (it.max !== undefined) el.max = it.max;
        if (it.step !== undefined) el.step = it.step;
        wrap.appendChild(labelEl); wrap.appendChild(el);
      }

      const up = tipText(it.key, 'up');
      const dn = tipText(it.key, 'dn');
      const note = tipText(it.key, 'note');
      if (up || dn || note) {
        const tips = document.createElement('div');
        tips.className = 'tips';
        if (up) {
          const s2 = document.createElement('span'); s2.className = 'up';
          s2.textContent = T('tips.up') + up; tips.appendChild(s2);
        }
        if (dn) {
          const s2 = document.createElement('span'); s2.className = 'dn';
          s2.textContent = T('tips.dn') + dn; tips.appendChild(s2);
        }
        if (note) {
          const s2 = document.createElement('span'); s2.className = 'note';
          s2.textContent = note; tips.appendChild(s2);
        }
        wrap.appendChild(tips);
      }

      el.dataset.key = it.key;
      el.addEventListener('input', updateChangeHint);
      el.addEventListener('change', () => { updateChangeHint(); refreshAvailability(); });
      const rec = { el, def: it.def, type: it.type,
                    onlyWhenCut: !!g.onlyWhenCut,
                    disabledWhenPrependOff: !!it.disabledWhenPrependOff };
      paramInputs[it.key] = rec;
      refs.push(rec);
      grid.appendChild(wrap);
    }
    d.appendChild(grid);
    root.appendChild(d);
    groupRefs.push({ el: d, refs, onlyWhenCut: !!g.onlyWhenCut, key: g.key });
  }
  refreshAvailability();
}

function refreshAvailability() {
  const cutOn = paramInputs.cut ? paramInputs.cut.el.checked : true;
  const prependOn = paramInputs.no_highlight_prepend
    ? !paramInputs.no_highlight_prepend.el.checked : true;

  for (const g of groupRefs) {
    const cutOff = g.onlyWhenCut && !cutOn;
    g.el.classList.toggle('disabled-group', cutOff);
    for (const r of g.refs) {
      r.el.disabled = cutOff || (r.disabledWhenPrependOff && !prependOn);
    }
    const mod = g.el.querySelector('[data-role="mod"]');
    if (!mod) continue;
    if (cutOff) {
      mod.textContent = T('params.inactive');
      mod.classList.remove('hidden');
    } else {
      const n = g.refs.filter(isDirty).length;
      if (n > 0) { mod.textContent = T('params.changedShort', { n }); mod.classList.remove('hidden'); }
      else mod.classList.add('hidden');
    }
  }
  updateChangeHint();
}

function isDirty(r) {
  if (r.type === 'checkbox') return r.el.checked !== !!r.def;
  if (r.type === 'select') return r.el.value !== r.def;
  return r.el.value.trim() !== String(r.def);
}

function collectParams() {
  const p = {};
  for (const [key, r] of Object.entries(paramInputs)) {
    if (r.el.disabled) continue;
    if (r.type === 'checkbox') { p[key] = r.el.checked; continue; }
    if (r.type === 'select') { p[key] = r.el.value; continue; }
    const v = r.el.value.trim();
    if (v === '') continue;
    p[key] = Number(v);
  }
  return p;
}

/** 切换语言时保留用户已填的值 */
function snapshotParams() {
  const out = {};
  for (const [k, r] of Object.entries(paramInputs)) {
    out[k] = (r.type === 'checkbox') ? r.el.checked : r.el.value;
  }
  return out;
}

function restoreParams(snap) {
  for (const [k, v] of Object.entries(snap || {})) {
    const r = paramInputs[k];
    if (!r) continue;
    if (r.type === 'checkbox') r.el.checked = !!v;
    else r.el.value = v;
  }
  refreshAvailability();
}

function updateChangeHint() {
  let n = 0;
  for (const r of Object.values(paramInputs)) {
    if (r.el.disabled) continue;
    if (isDirty(r)) n++;
  }
  $('changeHint').textContent = T('params.changed', { n });
}

function applyLang(lang) {
  window.I18N.setLang(lang);
  const L = window.I18N.lang;
  document.documentElement.lang = (L === 'zh') ? 'zh-CN' : 'en';
  document.title = T('app.title');

  document.querySelectorAll('[data-i18n]').forEach((el) => {
    el.textContent = T(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => {
    el.placeholder = T(el.dataset.i18nPh);
  });
  document.querySelectorAll('.lang-switch button').forEach((b) => {
    b.classList.toggle('active', b.dataset.lang === L);
  });

  const snap = snapshotParams();
  buildParams();
  restoreParams(snap);

  // 动态区域
  renderPicked();
  if (currentJob) {
    renderVideos(currentJob.videos || []);
    renderRunMeta(currentJob._summary, currentJob.status);
    if (currentJob.progress) applyProgress(currentJob.progress);
    $('mStage').textContent = statusText(currentJob.status);

}

/* ==================== 文件浏览 ==================== */
let selected = null;
let browserMode = 'file';

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

function openBrowser(mode, onPick) {
  browserMode = mode;
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `
    <div class="modal">
      <div class="head">
        <input type="text" id="fsPath" spellcheck="false" />
        <button class="ghost sm" id="fsGo">${T('fs.go')}</button>
      </div>
      <div class="fsquick" id="fsQuick"></div>
      <div class="body" id="fsBody"></div>
      <div class="foot">
        <span class="hint" id="fsHint"></span>
        <span>
          <button class="ghost sm" id="fsCancel">${T('dlg.cancel')}</button>
          <button class="sm" id="fsPickDir">${T('fs.pickDir')}</button>
        </span>
      </div>
    </div>`;
  document.body.appendChild(mask);

  const close = () => mask.remove();
  const body = mask.querySelector('#fsBody');
  const pathInput = mask.querySelector('#fsPath');
  const join = (base, name) => base.replace(/[\\/]+$/, '') + '\\' + name;

  async function load(p) {
    body.innerHTML = `<div class="fsrow hint">${T('fs.loading')}</div>`;
    try {
      const d = await api('/api/fs/list?path=' + encodeURIComponent(p));
      pathInput.value = d.path;
      body.innerHTML = '';
      if (d.parent) {
        const up = document.createElement('div');
        up.className = 'fsrow';
        up.innerHTML = `<span class="ic">↩</span><span>${T('fs.up')}</span>`;
        up.onclick = () => load(d.parent);
        body.appendChild(up);
      }
      for (const dir of d.dirs) {
        const r = document.createElement('div');
        r.className = 'fsrow';
        r.innerHTML = `<span class="ic">📁</span><span>${dir}</span>`;
        r.onclick = () => load(join(d.path, dir));
        body.appendChild(r);
      }
      for (const v of d.videos) {
        const r = document.createElement('div');
        r.className = 'fsrow';
        r.innerHTML = `<span class="ic">🎬</span><span>${v.name}</span><span class="sz">${v.mb} MB</span>`;
        if (browserMode === 'file') {
          r.onclick = () => {
            close();
            if (onPick) { onPick(join(d.path, v.name)); return; }
            selected = { type: 'file', path: join(d.path, v.name) };
            renderPicked();
          };
        }
        body.appendChild(r);
      }
      if (!d.dirs.length && !d.videos.length) {
        body.innerHTML += `<div class="fsrow hint">${T('fs.empty')}</div>`;
      }
      mask.querySelector('#fsHint').textContent = browserMode === 'file'
        ? T('fs.hintFile', { n: d.videos.length })
        : T('fs.hintDir', { n: d.videos.length });
    } catch (e) {
      body.innerHTML = `<div class="fsrow hint">${T('fs.readFail', { msg: e.message })}</div>`;
    }
  }

  api('/api/fs/roots').then((r) => {
    const q = mask.querySelector('#fsQuick');
    for (const [label, p] of [...r.quick.map((x) => [x.name, x.path]),
                              ...r.drives.map((d) => [d, d])]) {
      const b = document.createElement('button');
      b.className = 'ghost sm'; b.textContent = label;
      b.onclick = () => load(p);
      q.appendChild(b);
    }
    load(r.quick[0]?.path || r.drives[0] || '.');
  });

  mask.querySelector('#fsGo').onclick = () => load(pathInput.value);
  pathInput.onkeydown = (e) => { if (e.key === 'Enter') load(pathInput.value); };
  mask.querySelector('#fsCancel').onclick = close;
  mask.querySelector('#fsPickDir').onclick = () => {
    const dir = pathInput.value;
    close();
    if (onPick) { onPick(dir); return; }
    selected = { type: 'dir', path: dir };
    renderPicked();
  };
  if (browserMode === 'file') mask.querySelector('#fsPickDir').style.display = 'none';
}

function renderPicked() {
  const el = $('picked');
  const out = ($('outDir').value || '').trim();
  const outLine = out
    ? `<div style="margin-top:4px">${T('input.outDirPicked')}<b>${out}</b></div>`
    : `<div style="margin-top:4px" class="hint">${T('input.outDirDefault')}</div>`;

  if (!selected) {
    $('selPath').value = '';
    el.innerHTML = T('input.hint') + outLine;
    return;
  }
  $('selPath').value = selected.path;
  el.innerHTML = (selected.type === 'dir'
    ? `${T('input.pickedDir')}<b>${selected.path}</b>${T('input.dirNote')}`
    : `${T('input.pickedFile')}<b>${selected.path}</b>`) + outLine;
}

$('btnFile').onclick = () => openBrowser('file');
$('btnDir').onclick = () => openBrowser('dir');
$('btnOutDir').onclick = () => openBrowser('dir', (dir) => {
  $('outDir').value = dir;
  renderPicked();
});
$('selPath').oninput = () => {
  const v = $('selPath').value.trim();
  selected = v ? { type: /\.(mp4|avi|mov|mkv|webm|flv|wmv|m4v|mpg|mpeg|ts|3gp)$/i.test(v) ? 'file' : 'dir', path: v } : null;
  renderPicked();
};

/* ==================== 模型档位 ==================== */
async function loadModels(silent) {
  try {
    const d = await api('/api/models');
    const rec = paramInputs.model;
    if (!rec) return;
    const keep = rec.el.value || d.default;
    rec.el.innerHTML = '';
    for (const m of (d.models || [])) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = T(`model.${m.id}`);       // 名称走 i18n，不用后端中文
      rec.el.appendChild(o);
    }
    rec.el.value = keep;
    rec.def = d.default;
    const wrap = rec.el.closest('.pitem');
    const noteEl = wrap && wrap.querySelector('.tips .note');
    if (noteEl) {
      noteEl.textContent = (d.models || [])
        .map((m) => `${T(`model.${m.id}`)}: ${T(`model.${m.id}.note`)}`).join('; ');
    }
    if (!silent) updateChangeHint();
  } catch (e) {
    console.warn('models load failed', e);
  }
}

/* ==================== 参数预设 ==================== */
let presets = [];

async function loadPresets(selectId) {
  try {
    const d = await api('/api/presets');
    presets = d.presets || [];
  } catch (e) {
    presets = [];
  }
  const sel = $('presetSel');
  const keep = selectId !== undefined ? selectId : sel.value;
  sel.innerHTML = `<option value="">${T('preset.none')}</option>`;
  for (const p of presets) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = T('preset.option', { name: p.name, n: Object.keys(p.params || {}).length });
    sel.appendChild(o);
  }
  if (keep && presets.some((p) => p.id === keep)) sel.value = keep;
  syncPresetButtons();
}

function currentPreset() {
  const id = $('presetSel').value;
  return presets.find((p) => p.id === id) || null;
}

function syncPresetButtons() {
  const has = !!currentPreset();
  $('btnApplyPreset').disabled = !has;
  $('btnRenamePreset').disabled = !has;
  $('btnDeletePreset').disabled = !has;
}

function applyParams(p) {
  for (const r of Object.values(paramInputs)) {
    if (r.type === 'checkbox') r.el.checked = !!r.def;
    else if (r.type === 'select') r.el.value = r.def;
    else r.el.value = r.def === '' ? '' : r.def;
  }
  for (const [k, v] of Object.entries(p || {})) {
    const r = paramInputs[k];
    if (!r) continue;
    if (r.type === 'checkbox') r.el.checked = !!v;
    else if (r.type === 'select') r.el.value = String(v);
    else r.el.value = (v === null || v === undefined) ? '' : v;
  }
  refreshAvailability();
  updateChangeHint();
}

function openDialog({ title, message, value = '', hint = '', confirmText = 'OK',
                      danger = false, noInput = false, validate = null, onOk }) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `
    <div class="modal dlg">
      <div class="dlg-head">${title}</div>
      <div class="dlg-body">
        ${noInput ? `<div class="dlg-msg">${message || ''}</div>`
                  : '<input type="text" id="dlgInput" spellcheck="false" />'}
        ${noInput ? '' : '<div class="dlg-err" id="dlgErr"></div>'}
        ${hint ? `<div class="dlg-hint">${hint}</div>` : ''}
      </div>
      <div class="dlg-foot">
        <button class="ghost sm" id="dlgCancel">${T('dlg.cancel')}</button>
        <button class="sm${danger ? ' danger' : ''}" id="dlgOk">${confirmText}</button>
      </div>
    </div>`;
  document.body.appendChild(mask);

  const input = mask.querySelector('#dlgInput');
  const err = mask.querySelector('#dlgErr');
  const close = () => mask.remove();
  if (input) {
    input.value = value;
    setTimeout(() => { input.focus(); input.select(); }, 30);
  }

  const submit = () => {
    let v = '';
    if (input) {
      v = input.value.trim();
      if (validate) {
        const msg = validate(v);
        if (msg) { err.textContent = msg; input.focus(); return; }
      }
    }
    close();
    onOk(v);
  };

  mask.querySelector('#dlgOk').onclick = submit;
  mask.querySelector('#dlgCancel').onclick = close;
  if (input) {
    input.onkeydown = (e) => {
      if (e.key === 'Enter') submit();
      if (e.key === 'Escape') close();
    };
  }
  mask.onclick = (e) => { if (e.target === mask) close(); };
  setTimeout(() => (input ? input : mask.querySelector('#dlgOk')).focus(), 30);
}

$('presetSel').onchange = syncPresetButtons;

$('btnApplyPreset').onclick = () => {
  const p = currentPreset();
  if (!p) return;
  applyParams(p.params || {});
  $('presetHint').textContent = T('preset.applied', {
    name: p.name, n: Object.keys(p.params || {}).length });
};

$('btnSavePreset').onclick = () => {
  const params = collectParams();
  const n = Object.keys(params).length;
  const d = new Date();
  const stamp = `${d.getMonth() + 1}-${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  openDialog({
    title: T('preset.saveTitle'),
    hint: T('preset.saveHint', { n }),
    value: T('preset.defaultName', { stamp }),
    confirmText: T('preset.confirm'),
    validate: (v) => {
      if (!v) return T('dlg.emptyName');
      if (v.length > 40) return T('dlg.tooLong');
      if (presets.some((p) => p.name === v)) return T('dlg.dupName');
      return '';
    },
    onOk: async (name) => {
      try {
        const item = await api('/api/presets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, params }),
        });
        await loadPresets(item.id);
        $('presetHint').textContent = T('preset.saved', { name: item.name });
      } catch (e) {
        alert(T('preset.saveFail', { msg: e.message }));
      }
    },
  });
};

$('btnRenamePreset').onclick = () => {
  const p = currentPreset();
  if (!p) return;
  openDialog({
    title: T('preset.renameTitle'),
    value: p.name,
    hint: T('preset.renameHint', { n: Object.keys(p.params || {}).length }),
    confirmText: T('preset.confirm'),
    validate: (v) => {
      if (!v) return T('dlg.emptyName');
      if (v.length > 40) return T('dlg.tooLong');
      if (presets.some((x) => x.name === v && x.id !== p.id)) return T('dlg.dupName');
      return '';
    },
    onOk: async (name) => {
      try {
        await api(`/api/presets/${p.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, params: {} }),
        });
        await loadPresets(p.id);
        $('presetHint').textContent = T('preset.renamed', { name });
      } catch (e) {
        alert(T('preset.renameFail', { msg: e.message }));
      }
    },
  });
};

$('btnDeletePreset').onclick = () => {
  const p = currentPreset();
  if (!p) return;
  openDialog({
    title: T('preset.deleteTitle'),
    message: T('preset.deleteMsg', { name: p.name }),
    noInput: true,
    confirmText: T('dlg.delete'),
    danger: true,
    onOk: async () => {
      try {
        await api(`/api/presets/${p.id}`, { method: 'DELETE' });
        await loadPresets('');
        $('presetHint').textContent = T('preset.deleted', { name: p.name });
      } catch (e) {
        alert(T('preset.deleteFail', { msg: e.message }));
      }
    },
  });
};

/* ==================== 退出程序 ==================== */
function showQuitOverlay() {
  const m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = `<div class="modal dlg"><div class="dlg-body" style="text-align:center;padding:28px 20px">
      <div style="font-size:16px;font-weight:600;margin-bottom:8px">${T('quit.bye')}</div>
      <div class="dlg-hint" style="font-size:12px">${T('quit.byeHint')}</div>
    </div></div>`;
  document.body.appendChild(m);
  try { window.TTCometScene && window.TTCometScene.setMode('pause'); } catch (e) {}
}

$('btnQuit').onclick = () => {
  openDialog({
    title: T('quit.title'),
    message: T('quit.msg'),
    noInput: true,
    confirmText: T('quit.confirm'),
    danger: true,
    onOk: async () => {
      try {
        const r = await fetch('/api/shutdown', {
          method: 'POST',
          headers: { 'X-TTComet-Request': '1' },
        });
        if (r.status === 409) { alert(T('quit.busy')); return; }
        if (!r.ok) { alert(r.statusText); return; }
        showQuitOverlay();
      } catch (e) {
        // 进程已经退出时 fetch 会直接失败，这属于正常结果
        showQuitOverlay();
      }
    },
  });
};

/* ==================== 3D 场景联动 ==================== */
let lastPair = null;

function updateHeroPair(pair) {
  lastPair = pair;
  if (!pair) return;
  $('heroPair').textContent =
    `${T('animal.' + pair.left)} vs ${T('animal.' + pair.right)} · ${T('hero.playing')}`;
}

$('btnShuffle').onclick = () => {
  try { window.TTCometScene && window.TTCometScene.shuffle(); } catch (e) {}
};
window.addEventListener('pp:pair', (e) => updateHeroPair(e.detail));

/* ==================== 任务 ==================== */
let es = null;
let currentJob = null;

const STATUS_KEY = {
  queued: 'status.queued', running: 'status.running',
  done: 'status.done', failed: 'status.failed', cancelled: 'status.cancelled',
};

function statusText(s) { return T(STATUS_KEY[s] || s); }

function appendLog(line) {
  const el = $('log');
  if (el.dataset.ready !== '1') { el.textContent = ''; el.dataset.ready = '1'; }
  const div = document.createElement('div');
  div.className = 'logline';
  div.textContent = line;
  el.appendChild(div);
  while (el.childElementCount > 900) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function clearLog() {
  const el = $('log');
  el.textContent = '';
  el.dataset.ready = '1';
}

function sceneMode(m) {
  try { window.TTCometScene && window.TTCometScene.setMode(m); } catch (e) {}
}
function setBarActive(on) { $('bar').classList.toggle('active', on); }

function applyProgress(p) {
  if (!p) return;
  if (typeof p.percent === 'number') $('barFill').style.width = Math.min(100, p.percent) + '%';
  if (p.stage === 'inference') $('mStage').textContent = T('stage.inference');
  else if (p.stage === 'highlight') {
    $('mStage').textContent = T('stage.highlight');
    $('barFill').style.width = '100%';
  }
  if (p.video_name) $('mVideo').textContent = T('meta.video', {
    i: (p.video_index ?? 0) + 1, n: p.video_total ?? 1, name: p.video_name });
  if (p.frames !== undefined && p.total) {
    $('mFrames').textContent = T('meta.frames', { a: p.frames, b: p.total });
  }
  if (p.fps) $('mFps').textContent = T('meta.fps', { n: p.fps });
  if (p.eta_sec !== undefined) $('mEta').textContent = T('meta.eta', { n: Math.round(p.eta_sec) });
}

function renderVideos(videos) {
  const box = $('vlist');
  box.classList.remove('hidden');
  box.innerHTML = '';
  for (const v of videos) {
    const row = document.createElement('div');
    row.className = 'vitem ' + (v.status === 'running' ? 'running' : '');
    const size = v.size_mb ? `${v.size_mb} MB` : '';
    const frames = v.frames ? T('meta.framesShort', { n: v.frames, fps: v.fps }) : '';
    row.innerHTML = `
      <span class="name">${v.index + 1}. ${v.name}</span>
      <span class="hint">${frames}</span>
      <span class="st ${v.status}">${statusText(v.status)}</span>
      <span class="hint">${size}</span>`;
    if (v.video_url) {
      const b = document.createElement('button');
      b.className = 'ghost sm';
      b.textContent = T('result.play');
      b.onclick = () => {
        $('player').src = v.video_url + '?t=' + Date.now();
        $('player').classList.remove('hidden');
        $('dlLink').href = v.video_url;
        $('dlMeta').textContent = `${v.name} · ${size}`;
        $('dlWrap').classList.remove('hidden');
        $('player').scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      row.appendChild(b);
    }
    if (v.error) {
      const e = document.createElement('span');
      e.className = 'hint'; e.style.color = 'var(--bad)';
      e.textContent = v.error;
      row.appendChild(e);
    }
    box.appendChild(row);
  }
}

function renderRunMeta(summary, status) {
  if (!summary) return;
  $('runMeta').textContent = T('run.summary', {
    total: summary.total, done: summary.done, failed: summary.failed,
  }) + (status ? ` · ${statusText(status)}` : '');
}

function subscribe(jobId) {
  if (es) es.close();
  es = new EventSource(`/api/jobs/${jobId}/events`);
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snapshot') {
      const { job, summary, queue_position } = msg.data;
      currentJob = job;
      currentJob._summary = summary;
      if (queue_position > 1) $('mStage').textContent = T('run.queuePos', { n: queue_position });
      (job.log_tail || []).forEach(appendLog);
      applyProgress(job.progress);
      renderVideos(job.videos || []);
      renderRunMeta(summary, job.status);
    } else if (msg.type === 'log') appendLog(msg.data);
    else if (msg.type === 'progress') applyProgress(msg.data);
    else if (msg.type === 'status') {
      const stageKey = msg.data.stage === 'highlight' ? 'stage.highlight'
        : msg.data.stage === 'inference' ? 'stage.inference' : '';
      $('mStage').textContent = statusText(msg.data.status) + (stageKey ? ` · ${T(stageKey)}` : '');
    } else if (msg.type === 'videos') {
      if (currentJob) currentJob.videos = msg.data;
      renderVideos(msg.data);
    } else if (msg.type === 'done') {
      currentJob = msg.data;
      currentJob._summary = msg.data.result?.summary;
      renderVideos(msg.data.videos || []);
      renderRunMeta(msg.data.result?.summary, msg.data.status);
      $('btnRun').disabled = false;
      $('btnCancel').disabled = true;
      setBarActive(false);
      sceneMode('full');
      es.close();
    }
  };
  es.onerror = () => {};
}

$('btnRun').onclick = async () => {
  if (!selected || !selected.path) { alert(T('input.placeholder')); return; }
  $('btnRun').disabled = true;
  $('btnCancel').disabled = false;
  clearLog();
  $('player').classList.add('hidden');
  $('dlWrap').classList.add('hidden');
  $('vlist').classList.add('hidden');
  $('barFill').style.width = '0%';
  $('mStage').textContent = T('run.submitting');

  try {
    const params = collectParams();
    const outDir = ($('outDir').value || '').trim();
    if (outDir) params.output_dir = outDir;
    const d = await api('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: selected.path, params }),
    });
    sceneMode('calm');
    setBarActive(true);
    subscribe(d.id);
  } catch (e) {
    alert(e.message);
    $('btnRun').disabled = false;
    $('btnCancel').disabled = true;
    sceneMode('full');
  }
};

$('btnCancel').onclick = async () => {
  if (!currentJob) return;
  try { await api(`/api/jobs/${currentJob.id}/cancel`, { method: 'POST' }); }
  catch (e) { alert(e.message); }
};

$('btnReset').onclick = () => {
  for (const r of Object.values(paramInputs)) {
    if (r.type === 'checkbox') r.el.checked = !!r.def;
    else if (r.type === 'select') r.el.value = r.def;
    else r.el.value = r.def === '' ? '' : r.def;
  }
  refreshAvailability();
};

/* ==================== 自检 ==================== */
function loadHealth() {
  api('/api/health').then((h) => {
    const loaded = (h.models || []).length;
    $('health').innerHTML = [
      `${T('health.backend')} <b>${h.backend}</b>`,
      T('health.models', { n: loaded }),
      `${T('health.ffmpeg')} <b>${h.ffmpeg ? T('health.ffmpegOk') : T('health.ffmpegMissing')}</b>`,
      T('health.disk', { n: h.disk_free_gb }),
      h.model_loaded ? T('health.modelLoaded') : T('health.modelIdle'),
    ].join(' · ');
    if (h.default_path) $('selPath').placeholder = T('input.placeholder');
  }).catch((e) => {
    $('health').textContent = T('health.fail', { msg: e.message });
  });
}

/* ==================== 初始化 ==================== */
applyLang(window.I18N.lang);
loadModels();
loadPresets();
loadHealth();
</script>
